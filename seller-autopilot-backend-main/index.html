<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Autopilot — AI Automations for Shopify Sellers</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Satoshi:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --accent-glow: rgba(124,92,252,0.3);
    --text: #f0f0f8;
    --text-muted: #8888aa;
    --green: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Satoshi', sans-serif; min-height: 100vh; overflow-x: hidden; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(10,10,15,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Clash Display', sans-serif; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 24px 80px; }
  h1 { font-family: 'Clash Display', sans-serif; font-size: clamp(48px, 7vw, 88px); font-weight: 700; line-height: 1.0; letter-spacing: -3px; margin-bottom: 24px; }
  h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .btn-primary { background: linear-gradient(135deg, var(--accent), #5a3fd6); color: white; border: none; padding: 16px 36px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 40px var(--accent-glow); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px var(--accent-glow); }
  .btn-login { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-right: 10px; }
  .btn-login:hover { color: var(--text); border-color: var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; position: relative; }
  .modal-close { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-muted); font-size: 24px; line-height: 1; }
  .modal-close:hover { color: var(--text); }

  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; color: var(--text); outline: none; font-size: 15px; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }

  .btn-submit { width: 100%; background: linear-gradient(135deg, var(--accent), #5a3fd6); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; transition: all 0.2s; box-shadow: 0 0 30px var(--accent-glow); }
  .btn-submit:hover { transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .btn-google { width: 100%; padding: 14px; background: white; color: #000; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; transition: opacity 0.2s; }
  .btn-google:hover { opacity: 0.9; }

  .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: var(--text-muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .error-msg { color: #fc5c7d; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<nav>
  <div class="logo">Seller Autopilot</div>
  <div id="nav-auth">
    <button class="btn-login" onclick="showModal('login')">Log In</button>
    <button class="btn-primary" style="padding: 10px 20px;" onclick="showModal('signup')">Sign Up</button>
  </div>
</nav>

<section class="hero">
  <h1>Your store runs<br><span>itself.</span></h1>
  <p style="color:var(--text-muted); max-width: 500px; margin-bottom: 40px;">AI automations for Shopify sellers. Plug and play.</p>
  <button class="btn-primary" onclick="showModal('signup')">Start Free Trial</button>
</section>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-close" onclick="closeModal()">×</div>
    <h2 id="modal-title" style="margin-bottom: 8px; font-family: 'Clash Display';">Create Account</h2>
    <p id="modal-sub" style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Start your 14-day free trial.</p>

    <form id="auth-form">
      <div id="name-group" class="form-group">
        <label>Full Name</label>
        <input type="text" id="auth-name" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="auth-email" placeholder="alex@store.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-pass" placeholder="••••••••" required>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button type="submit" class="btn-submit" id="btn-submit">Create Account</button>
    </form>

    <div class="divider">OR</div>

    <button class="btn-google" onclick="loginWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
      Continue with Google
    </button>

    <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted); text-align: center;" id="modal-footer">
      Already have an account? <a onclick="toggleAuthMode()" style="color: var(--accent); cursor: pointer;">Log in</a>
    </p>
  </div>
</div>

<script>
  let isLogin = false;

  window.onload = () => {
    const user = localStorage.getItem('user');
    // /dashboard serves the same SPA shell; redirecting again causes a reload loop.
    if (user && window.location.pathname !== '/dashboard') {
      window.location.replace('/dashboard');
    }
  };

  function showModal(mode) {
    document.getElementById('modal-overlay').classList.add('active');
    document.getElementById('error-msg').classList.remove('show');
    if (mode === 'login') {
      isLogin = true;
      document.getElementById('modal-title').innerText = "Welcome Back";
      document.getElementById('modal-sub').innerText = "Log in to your account.";
      document.getElementById('name-group').style.display = "none";
      document.getElementById('btn-submit').innerText = "Log In";
      document.getElementById('modal-footer').innerHTML = "Don't have an account? <a onclick='toggleAuthMode()' style='color: var(--accent); cursor: pointer;'>Sign up</a>";
    } else {
      isLogin = false;
      document.getElementById('modal-title').innerText = "Create Account";
      document.getElementById('modal-sub').innerText = "Start your 14-day free trial.";
      document.getElementById('name-group').style.display = "block";
      document.getElementById('btn-submit').innerText = "Create Account";
      document.getElementById('modal-footer').innerHTML = "Already have an account? <a onclick='toggleAuthMode()' style='color: var(--accent); cursor: pointer;'>Log in</a>";
    }
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
    document.getElementById('error-msg').classList.remove('show');
  }

  function toggleAuthMode() {
    isLogin = !isLogin;
    showModal(isLogin ? 'login' : 'signup');
  }

  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const errorMsg = document.getElementById('error-msg');
    errorMsg.classList.remove('show');
    btn.disabled = true;
    btn.innerText = isLogin ? "Logging in..." : "Creating account...";

    const name = document.getElementById('auth-name').value;
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-pass').value;

    const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
    const body = isLogin ? { email, password } : { name, email, password };

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('user', JSON.stringify(data));
        if (isLogin) {
          window.location.replace('/dashboard');
        } else {
          closeModal();
          showModal('login');
          document.getElementById('modal-sub').innerText = "Account created! Please log in.";
        }
      } else {
        errorMsg.innerText = data.message || "Something went wrong.";
        errorMsg.classList.add('show');
        btn.disabled = false;
        btn.innerText = isLogin ? "Log In" : "Create Account";
      }
    } catch (err) {
      errorMsg.innerText = "Cannot connect to server. Try again.";
      errorMsg.classList.add('show');
      btn.disabled = false;
      btn.innerText = isLogin ? "Log In" : "Create Account";
    }
  };

  function loginWithGoogle() {
    alert("Google Login coming soon!");
  }
</script>

</body>
</html>
